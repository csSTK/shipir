shipir:
  security:
    # true when users reach Shipir over HTTPS (TLS at a reverse proxy): Secure session + XSRF cookies, HSTS header.
    https: ${SHIPIR_SECURITY_HTTPS:false}
    login:
      max-attempts: 5
      window: 15m
      lockout: 15m
  api-tokens:
    # longest expiry a personal API token may get, also its default when none is given
    max-lifetime: 365d
    # last_used_at is written again only when older than this
    last-used-resolution: 5m
    # most tokens one user may hold at a time (creating more -> 409 TOKEN_LIMIT_REACHED)
    max-per-user: 20
  docker:
    local-socket: unix:///var/run/docker.sock
    connect-timeout: 3s
    read-timeout: 10s
  host:
    overview-timeout: 5s
  stats:
    # resource usage history: one sample per running container and tick, kept for retention_settings.stats_days
    recorder-enabled: true
    interval: 60s
    # time one host may take per tick; a slower host is skipped for that tick
    host-timeout: 20s
    max-containers: 200
    # most points per container series of GET /api/hosts/{h}/stats/history
    max-points: 300
    # most container series per history request (those with the most recent samples first)
    max-series: 50
  images:
    update-check-enabled: true
    update-check-interval: 6h
    # uploaded or cloned build context (tar or tar.gz), enforced while streaming; spring.servlet.multipart.* must allow it too
    max-build-context: 200MB
    build-timeout: 30m
  uptime:
    # HTTP uptime checks of managed deployments. Targets go through the egress policy (shipir.egress.*): private
    # ranges are refused unless shipir.egress.allow-private-ranges is on; link-local and metadata always.
    enabled: true
    tick: 10s
    # consecutive failures before a check is DOWN (one success brings it UP again)
    failure-threshold: 2
    result-retention: 14d
  image-auto-update:
    # scheduled pull + up of FILE deployments that opted in (per deployment: on/off + daily UTC window)
    enabled: true
    tick: 60s
    # time the new containers get to become healthy, else the previous image digests are restored
    health-timeout: 2m
    # a container without healthcheck must stay running this long
    stable-for: 30s
    health-poll: 5s
    # cap for waiting on pull + up
    run-timeout: 20m
  compose:
    timeout: 10m
    # Absolute directories (LOCAL host only) adoption may read compose files from; empty = YAML must be pasted.
    adopt-allowed-dirs: []
  ai:
    connect-timeout: 5s
    read-timeout: 180s
  egress:
    # SSRF policy for outbound requests to user-influenced URLs (git, registries, ...). Loopback, private (RFC 1918,
    # ULA, CGNAT) targets are refused by default; set true only if your git server/registry lives on such a network.
    # Link-local and cloud metadata addresses stay blocked either way.
    allow-private-ranges: ${SHIPIR_EGRESS_ALLOW_PRIVATE_RANGES:false}
  git:
    # overall deadline of one fetch (connect-timeout is only an inactivity timeout) and cap for the checkout dir on disk;
    # exceeding either aborts the fetch and deletes the directory (GIT_CLONE_TIMEOUT / GIT_REPO_TOO_LARGE)
    clone-timeout: 10m
    max-checkout-size: 500MB
    poll-enabled: true
    poll-tick: 60s
  volume-backup:
    # cap for one backup stream and one restore upload; its own limit, independent of the multipart one, but
    # spring.servlet.multipart.max-file-size/max-request-size below must be at least as large (VolumeBackupPropertiesTest)
    max-bytes: 100MB
    # short-lived helper container with only the volume mounted (never started: the archive API does the work)
    helper-image: alpine:3
    # archives of scheduled backups: <dir>/<hostId>/<volume>/<volume>-<timestamp>.tar
    dir: ${SHIPIR_VOLUME_BACKUP_DIR:./data/volume-backups}
    scheduler-enabled: true
    tick: 1m
  streaming:
    exec:
      # interactive container consoles are ADMIN only; true also lets OPERATORs with an OPERATE grant on the host
      # or the owning deployment open one (shipr-bbzh.4)
      operator-enabled: false
  container-files:
    max-bytes: 100MB
    max-scan-bytes: 64MB
  log-download:
    # one container log download stops (with a marker line) at this many bytes or this much time
    max-bytes: 50MB
    timeout: 2m
  openapi:
    # OpenAPI spec at /api/v3/api-docs and Swagger UI at /api/docs; both need a login (anyRequest().authenticated()).
    # Set SHIPIR_OPENAPI_ENABLED=false to switch both off.
    enabled: ${SHIPIR_OPENAPI_ENABLED:true}
  stacks:
    base-dir: ${SHIPIR_STACKS_BASE_DIR:./data/stacks}
  initial-admin:
    username: ${SHIPIR_INITIAL_ADMIN_USERNAME:admin}
    password: ${SHIPIR_INITIAL_ADMIN_PASSWORD:}
springdoc:
  api-docs:
    enabled: ${shipir.openapi.enabled}
    path: /api/v3/api-docs
  swagger-ui:
    enabled: ${shipir.openapi.enabled}
    path: /api/docs
    csrf:
      enabled: true
  webjars:
    prefix: /api/swagger-ui-assets
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${shipir.security.https}
spring:
  application:
    name: shipir
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shipir}
    username: ${DB_USER:shipir}
    password: ${DB_PASSWORD}
  servlet:
    multipart:
      # image build context (shipir.images.max-build-context = 200MB) and container file upload (100MB, checked again in
      # the service) and volume restore (shipir.volume-backup.max-bytes, 100MB) plus multipart framing; parsed lazily so the controller advice can answer a too-large upload with 413
      max-file-size: 201MB
      max-request-size: 201MB
      resolve-lazily: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
