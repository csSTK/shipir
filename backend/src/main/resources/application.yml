shipir:
  docker:
    local-socket: unix:///var/run/docker.sock
    connect-timeout: 3s
    read-timeout: 10s
  host:
    overview-timeout: 5s
  compose:
    timeout: 10m
  ai:
    connect-timeout: 5s
    read-timeout: 180s
  git:
    poll-enabled: true
    poll-tick: 60s
  stacks:
    base-dir: ${SHIPIR_STACKS_BASE_DIR:./data/stacks}
  initial-admin:
    username: ${SHIPIR_INITIAL_ADMIN_USERNAME:admin}
    password: ${SHIPIR_INITIAL_ADMIN_PASSWORD:}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
spring:
  application:
    name: shipir
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shipir}
    username: ${DB_USER:shipir}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true
