# Test baseline: lets the context start (InitialAdminSeeder needs a password on an empty database).
shipir.initial-admin.password=test-initial-admin-password
shipir.host.health-check-enabled=false
shipir.retention.purge-enabled=false
shipir.git.poll-enabled=false
shipir.images.update-check-enabled=false
shipir.host.container-watch.enabled=false
shipir.volume-backup.scheduler-enabled=false
shipir.image-auto-update.enabled=false
# Tests reach local stubs on 127.0.0.1; the egress policy itself is covered by its own tests with default deny.
shipir.egress.allow-private-ranges=true
shipir.stats.recorder-enabled=false
