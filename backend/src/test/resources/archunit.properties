# ArchUnit configuration (read from the test classpath).
#
# Frozen rules (ArchitectureRules.moduleCyclesFrozen): violations known today are stored in the committed store below
# and tolerated; any violation not in the store fails the build.
#
# Store path: relative paths resolve against the JVM working directory. Maven surefire runs with backend/ as working
# directory (${basedir}), both for `./backend/mvnw -f backend/pom.xml` from the repo root and from backend/. So this
# is backend/src/test/resources/archunit_store.
freeze.store.default.path=src/test/resources/archunit_store

# CI (and every normal run) must neither create the store nor change it. A missing store fails the test instead of
# silently freezing everything. With updates off, ArchUnit refuses to rewrite the store, so a violation that is new
# (fails as a violation) and a baseline entry that disappeared (fails with "Updating frozen violations is disabled")
# both break the build until a human updates the store deliberately.
freeze.store.default.allowStoreCreation=false
freeze.store.default.allowStoreUpdate=false
freeze.refreeze=false

# Violations are matched without line numbers (ArchUnit's default matcher strips "(File.java:123)"), so unrelated
# edits that only move code do not invalidate the baseline. Changing a dependency of a baselined cycle changes its
# text and counts as a new violation.
#
# Shrinking the baseline after a cycle is broken (the build then fails with "Updating frozen violations is disabled"):
# set allowStoreUpdate=true locally, run the architecture test, review the shrunken store diff, set the flag back to
# false and commit. To create the baseline from scratch, delete the store directory and also set allowStoreCreation=true.
