name: CI

# Dev and PR checks: path-filtered, affected-only tests, the shell tests of scripts/ and the code map check. e2e,
# visual tests, build and image builds run on release (release.yml) only; that run always executes the full suites.

on:
  push:
    branches: [dev]
  pull_request:
    # Everything except docs, config and tooling; the code map and its checker are re-included (later patterns win)
    # because the code map check in `changes` must also run for map-only pull requests.
    paths:
      - '**'
      - '!**/*.md'
      - '!renovate.json'
      - '!LICENSE*'
      - '!LICENCE'
      - '!.vscode/**'
      - '!.claude/**'
      - 'docs/code-map/**'
      - '.claude/scripts/code-map-check.mjs'

# A newer PR commit replaces the running check; a dev push is never cancelled (its minutes are already billed).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # dorny/paths-filter reads the changed files of a pull request via the API
  pull-requests: read

jobs:
  # Decides what the test run has to cover, then runs the small checks (script tests, code map) on the same runner:
  # each as its own job cost a billed minute for a few seconds of work.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      csp: ${{ steps.filter.outputs.csp }}
      affected: ${{ steps.base.outputs.affected }}
      base: ${{ steps.base.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the base commit must be reachable to validate it
          fetch-depth: 0

      # Commit the tests diff against: the PR base, or the previous head of the pushed branch. A push without a
      # usable previous head (new branch: all zeros, force push: commit gone) runs everything (affected=false).
      - id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          base="$PUSH_BEFORE"
          [[ "$EVENT_NAME" == "pull_request" ]] && base="$PR_BASE"
          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "Affected-test selection against $base"
            echo "affected=true" >> "$GITHUB_OUTPUT"
            echo "base=$base" >> "$GITHUB_OUTPUT"
          else
            echo "No usable base commit ('$base'): running everything"
            echo "affected=false" >> "$GITHUB_OUTPUT"
            echo "base=" >> "$GITHUB_OUTPUT"
          fi

      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'scripts/ci/**'
              - '.github/workflows/tests.yml'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/tests.yml'
              - '.github/workflows/ci.yml'
            # CSP and nginx header checks (tests.yml csp job) on dev and PR runs
            csp:
              - 'frontend/nginx/**'
              - 'frontend/index.html'
              - 'frontend/vite.config.ts'
              - 'frontend/playwright.csp.config.ts'
              - 'frontend/e2e-csp/**'
              - 'frontend/package.json'
              - 'frontend/pnpm-lock.yaml'
              - '.github/workflows/tests.yml'
              - '.github/workflows/ci.yml'
            scripts:
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            # the code map check verifies that every mapped path exists, so any source, tooling or root file counts
            codemap:
              - 'docs/code-map/**'
              - 'tools/**'
              - 'backend/**'
              - 'frontend/**'
              - 'scripts/**'
              - '.github/**'
              - '.claude/**'
              - '*'

      # Shell tests for scripts/. The backup one puts stubs for docker, pg_dump, pg_restore and psql
      # on PATH, so it starts no container and touches no database; the runner needs nothing extra.
      - name: Backup and restore script test
        if: ${{ steps.filter.outputs.scripts == 'true' }}
        run: scripts/backup-restore.test.sh

      - name: Affected backend tests selection test
        if: ${{ steps.filter.outputs.scripts == 'true' }}
        run: scripts/ci/affected-backend-tests.test.sh

      # Mechanical rules for docs/code-map/ (entry format, length, no bead IDs, paths exist, index links),
      # run by wavework's checker (.claude/scripts/code-map-check.mjs, generated; do not edit). Node only, no install.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.filter.outputs.codemap == 'true' }}
        with:
          node-version: 26

      - name: Code map check
        if: ${{ steps.filter.outputs.codemap == 'true' }}
        run: node .claude/scripts/code-map-check.mjs docs/code-map --id-prefix shipr- --max 160

  # `!cancelled()`: a failing script test or code map check in `changes` must not hide the test results.
  tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.backend == 'true' || needs.changes.outputs.frontend == 'true') }}
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read
    with:
      backend: ${{ needs.changes.outputs.backend == 'true' }}
      frontend: ${{ needs.changes.outputs.frontend == 'true' }}
      e2e: false
      affected: ${{ needs.changes.outputs.affected == 'true' }}
      base: ${{ needs.changes.outputs.base }}
      csp: ${{ needs.changes.outputs.csp == 'true' }}
