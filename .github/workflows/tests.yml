name: Tests

on:
  workflow_call:
    inputs:
      backend:
        description: Run backend tests (Maven verify)
        type: boolean
        default: false
      frontend:
        description: Run frontend lint, unit tests and build
        type: boolean
        default: false
      e2e:
        description: Run Playwright e2e tests
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      backend:
        description: Run backend tests (Maven verify)
        type: boolean
        default: false
      frontend:
        description: Run frontend lint, unit tests and build
        type: boolean
        default: false
      e2e:
        description: Run Playwright e2e tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    if: ${{ inputs.backend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testcontainers uses the Docker daemon of the runner.
      - name: Maven verify
        run: ./backend/mvnw -f backend/pom.xml -B verify

  frontend:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in frontend/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    if: ${{ inputs.e2e }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the Vite dev server itself (webServer); the API is mocked.
      - run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # Screenshot regression: renders inside the Playwright docker image (tag read from pnpm-lock.yaml) so the
      # committed baselines in frontend/e2e/visual-baselines match pixel for pixel. Regenerate with `pnpm e2e:visual:update`.
      - name: Screenshot regression tests
        run: pnpm e2e:visual

      - name: Upload screenshot diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: visual-diffs
          path: |
            frontend/test-results/
            frontend/playwright-report-visual/
          if-no-files-found: ignore
          retention-days: 7

  # Runs with the frontend tests (so on dev pushes too): CSP regressions must not wait for a release.
  csp:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Builds the app and serves it with `vite preview` under the CSP from nginx/security-headers.inc.template.
      - run: pnpm e2e:csp

  nginx-headers:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Starts the nginx image with the real templates; the runner has Docker.
      - run: ./frontend/nginx/check-headers.sh
