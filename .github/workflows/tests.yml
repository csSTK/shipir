name: Tests

on:
  workflow_call:
    inputs:
      backend:
        description: Run backend tests (Maven verify)
        type: boolean
        default: false
      frontend:
        description: Run frontend lint, unit tests and build
        type: boolean
        default: false
      e2e:
        description: Run Playwright e2e tests
        type: boolean
        default: false
      affected:
        description: Run only the tests affected by the diff against `base` (dev and PR runs); false runs everything (release)
        type: boolean
        default: false
      base:
        description: Commit to diff against when `affected` is true
        type: string
        default: ''
      csp:
        description: With `affected`, a file the CSP and nginx header checks depend on changed
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      backend:
        description: Run backend tests (Maven verify)
        type: boolean
        default: false
      frontend:
        description: Run frontend lint, unit tests and build
        type: boolean
        default: false
      e2e:
        description: Run Playwright e2e tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    if: ${{ inputs.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the affected-test selection diffs against `base`
          fetch-depth: ${{ inputs.affected && '0' || '1' }} # quoted: a number 0 is falsy, so `&& 0 || 1` would give 1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # FULL, NONE or a -Dtest pattern list; the reasons are printed to the log. Without `affected` it is FULL.
      - name: Select backend tests
        id: select
        env:
          AFFECTED: ${{ inputs.affected }}
          BASE: ${{ inputs.base }}
        run: |
          if [[ "$AFFECTED" == "true" && -n "$BASE" ]]; then
            selection="$(scripts/ci/affected-backend-tests.sh --base "$BASE")"
          else
            echo "affected: FULL: affected-test selection is off for this run" >&2
            selection=FULL
          fi
          echo "Selected backend tests: $selection"
          echo "selection=$selection" >> "$GITHUB_OUTPUT"

      # Testcontainers uses the Docker daemon of the runner. Two Surefire forks run test classes side by side: every
      # Spring context has its own Postgres container and a random port, and Docker resources are UUID-named.
      - name: Maven verify
        if: ${{ steps.select.outputs.selection != 'NONE' }}
        env:
          SELECTION: ${{ steps.select.outputs.selection }}
        run: |
          if [[ "$SELECTION" == "FULL" ]]; then
            ./backend/mvnw -f backend/pom.xml -B verify -DforkCount=2 -DreuseForks=true
          else
            ./backend/mvnw -f backend/pom.xml -B verify -DforkCount=2 -DreuseForks=true -Dtest="$SELECTION" -Dsurefire.failIfNoSpecifiedTests=false
          fi

  frontend:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `vitest --changed` and the full-run triggers diff against `base`
          fetch-depth: ${{ inputs.affected && '0' || '1' }} # quoted: a number 0 is falsy, so `&& 0 || 1` would give 1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

      # Dev and PR runs (`affected`): type check always, full unit tests only when the test setup changed,
      # otherwise only the tests that import a changed file. `pnpm build` is left to the release run.
      - name: Type check
        if: ${{ inputs.affected }}
        run: pnpm exec tsc -b

      - name: Unit tests
        env:
          AFFECTED: ${{ inputs.affected }}
          BASE: ${{ inputs.base }}
        run: |
          if [[ "$AFFECTED" != "true" || -z "$BASE" ]]; then
            echo "Unit tests: full run (affected-test selection is off for this run)"
            pnpm test
          elif git diff --name-only "$BASE...HEAD" | grep -Eq '^frontend/(package\.json|pnpm-lock\.yaml|vite\.config\.ts|tsconfig[^/]*|src/app/|src/test/)|^\.github/workflows/'; then
            echo "Unit tests: full run (package.json, lockfile, Vite or tsconfig, src/app, src/test or a workflow changed)"
            pnpm test
          else
            echo "Unit tests: only tests affected by the diff against $BASE"
            pnpm vitest run --changed "$BASE" --passWithNoTests
          fi

      - name: Build
        if: ${{ !inputs.affected }}
        run: pnpm build

  e2e:
    if: ${{ inputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the Vite dev server itself (webServer); the API is mocked.
      - run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # Screenshot regression: renders inside the Playwright docker image (tag read from pnpm-lock.yaml) so the
      # committed baselines in frontend/e2e/visual-baselines match pixel for pixel. Regenerate with `pnpm e2e:visual:update`.
      - name: Screenshot regression tests
        run: pnpm e2e:visual

      - name: Upload screenshot diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            frontend/test-results/
            frontend/playwright-report-visual/
          if-no-files-found: ignore
          retention-days: 7

  # CSP e2e and nginx security header checks. Release runs always; dev and PR runs (`affected`) only when a file they
  # depend on changed (the `csp` input, set by ci.yml: frontend/nginx/**, index.html, vite.config.ts,
  # playwright.csp.config.ts, e2e-csp/, package.json, lockfile).
  csp:
    if: ${{ inputs.frontend && (!inputs.affected || inputs.csp) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Starts the nginx image with the real templates and checks the headers of static answers (Docker, no install).
      - name: nginx security headers
        run: nginx/check-headers.sh

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Builds the app and serves it with `vite preview` under the CSP from nginx/security-headers.inc.template.
      - run: pnpm e2e:csp
