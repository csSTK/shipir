name: Tests

on:
  workflow_call:
    inputs:
      backend:
        description: Run backend tests (Maven verify)
        type: boolean
        default: false
      frontend:
        description: Run frontend lint, unit tests and build
        type: boolean
        default: false
      e2e:
        description: Run Playwright e2e tests
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      backend:
        description: Run backend tests (Maven verify)
        type: boolean
        default: false
      frontend:
        description: Run frontend lint, unit tests and build
        type: boolean
        default: false
      e2e:
        description: Run Playwright e2e tests
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  backend:
    if: ${{ inputs.backend }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # Testcontainers uses the Docker daemon of the runner.
      - name: Maven verify
        run: ./backend/mvnw -f backend/pom.xml -B verify

  frontend:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  e2e:
    if: ${{ inputs.e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Playwright starts the Vite dev server itself (webServer); the API is mocked.
      - run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      # Screenshot regression: renders inside the Playwright docker image (tag read from pnpm-lock.yaml) so the
      # committed baselines in frontend/e2e/visual-baselines match pixel for pixel. Regenerate with `pnpm e2e:visual:update`.
      - name: Screenshot regression tests
        run: pnpm e2e:visual

      - name: Upload screenshot diffs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: |
            frontend/test-results/
            frontend/playwright-report-visual/
          if-no-files-found: ignore
          retention-days: 7

  # Runs with the frontend tests (so on dev pushes too): CSP regressions must not wait for a release.
  csp:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      # Builds the app and serves it with `vite preview` under the CSP from nginx/security-headers.inc.template.
      - run: pnpm e2e:csp

  nginx-headers:
    if: ${{ inputs.frontend }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./frontend/nginx/check-headers.sh
