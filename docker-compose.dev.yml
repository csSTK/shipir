# Local development database (PostgreSQL 16).
# Usage: copy .env.example to .env, set DB_PASSWORD, then run:
#   docker compose -f docker-compose.dev.yml up -d
# DB_NAME, DB_USER and DB_PORT are read from .env (defaults: shipir, shipir, 5432).
services:
  postgres:
    image: postgres:19-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-shipir}
      POSTGRES_USER: ${DB_USER:-shipir}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - shipir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  shipir-pgdata:
