# Local development database (PostgreSQL 16).
# Usage: copy .env.example to .env, set DB_PASSWORD, then run:
#   docker compose -f docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: shipir
      POSTGRES_USER: shipir
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
    ports:
      - "5432:5432"
    volumes:
      - shipir-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipir -d shipir"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  shipir-pgdata:
