# Hosting stack: Shipir backend and frontend. PostgreSQL is NOT part of this file;
# point DB_HOST/DB_PORT in .env at an existing PostgreSQL 16 server.
# Usage: copy .env.example to .env, set DB_PASSWORD and DB_HOST, then run:
#   docker compose -f docker-compose.yml up -d
# The backend mounts the Docker socket (see README: it is effectively root on the host). DOCKER_GID is the
# group owning that socket on the host; the backend user (uid 10001) joins it via group_add.
# Images are pulled from ghcr.io (SHIPIR_TAG, default latest); without a pull they are built locally.
services:
  backend:
    image: ghcr.io/csstk/shipir-backend:${SHIPIR_TAG:-latest}
    build: ./backend
    environment:
      DB_HOST: ${DB_HOST:?Set DB_HOST in .env to the external PostgreSQL host (see .env.example)}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-shipir}
      DB_USER: ${DB_USER:-shipir}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env (see .env.example)}
      SHIPIR_INITIAL_ADMIN_PASSWORD: ${SHIPIR_INITIAL_ADMIN_PASSWORD:-}
      # Optional while only LOCAL Docker hosts exist; required for TCP+TLS hosts (startup fails without a valid key).
      SHIPIR_ENCRYPTION_KEY: ${SHIPIR_ENCRYPTION_KEY:-}
      # true behind an HTTPS reverse proxy: Secure cookies + HSTS (see README, "HTTPS and reverse proxy").
      SHIPIR_SECURITY_HTTPS: ${SHIPIR_HTTPS:-false}
      # Peer addresses (comma-separated) of the frontend/nginx container; needed for per-client login throttling.
      SHIPIR_SECURITY_TRUSTED_PROXIES: ${SHIPIR_SECURITY_TRUSTED_PROXIES:-}
    # Access to the local Docker daemon. Grants root-equivalent control of the host; keep the stack private.
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env to the owner group of /var/run/docker.sock (see .env.example)}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Compose stack files (SHIPIR_STACKS_BASE_DIR in the image). Named volume: survives `down`, removed only by `down -v`.
      - shipir-stacks:/data/stacks
    # No ports: the backend is reachable only from the frontend on the compose network.
    restart: unless-stopped

  frontend:
    image: ghcr.io/csstk/shipir-frontend:${SHIPIR_TAG:-latest}
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
      SHIPIR_HTTPS: ${SHIPIR_HTTPS:-false}
    ports:
      - "${SHIPIR_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  shipir-stacks:
